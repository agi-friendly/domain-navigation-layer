[dnl]
version = "0.1"
name = "domain-navigation-layer"

[scan]
include = ["DNL-system"]
exclude = [".git", "CURRENT_WORKING", ".repo-history", "DNL-system/history"]

[paths.internal]
"dnl-root" = "."
"DNL-system" = "DNL-system"

[paths.external]


[profiles]
portal = [
  "DNL-system/README.md",
  "AGENTS.md",
]
links = [
  "DNL-system",
  "AGENTS.md",
]

[portal]
readme_dirs = [
  "00_start-here",
  "ai",
  "authoring",
  "boundaries",
  "dnl-history",
  "glossary",
  "history",
  "links",
  "maps",
  "rules",
  "runbooks",
  "status",
  "templates",
  "workflow",
]

[tags.required_by_filename]
"README.md" = ["portal-dnl"]

[tags.required_by_path]
"DNL-system/authoring/rules/*.md" = ["rule-dnl"]
